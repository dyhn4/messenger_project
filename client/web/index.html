<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TangoTalk 메신저">
  <meta name="theme-color" content="#3F51B5">

  <!-- 아이폰 홈 화면에 추가했을 때 — 주소창 없는 독립 창으로 열리고(그래야 웹 푸시도 받는다), 이 이름·아이콘을 쓴다. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TangoTalk">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TangoTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 로더 설정은 web/flutter_bootstrap.js(우리 서비스 워커 web/sw.js를 Flutter 것이 덮어쓰지 않게 한다). -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
